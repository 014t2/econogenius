server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Permite subida de extractos PDF / Excel de hasta 15 MB
    client_max_body_size 15M;

    # Compresión gzip para assets estáticos
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1024;

    # Proxy interno hacia el backend FastAPI por la red privada aislada del proyecto
    location /api/ {
        proxy_pass http://econogenius-backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Caché de assets con hash de Vite
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Soporte SPA (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
