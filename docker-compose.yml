name: econogenius

services:
  econogenius-db:
    image: postgres:16-alpine
    container_name: econogenius-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-econogenius}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Econogenius_DB_2026_Secure!}
      POSTGRES_DB: ${POSTGRES_DB:-econogenius}
    volumes:
      - econogenius_postgres_data:/var/lib/postgresql/data
    networks:
      - econogenius-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-econogenius} -d ${POSTGRES_DB:-econogenius}"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - "traefik.enable=false"

  econogenius-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: econogenius-backend
    restart: unless-stopped
    depends_on:
      econogenius-db:
        condition: service_healthy
    environment:
      APP_NAME: "€conogenius"
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:-econogenius}:${POSTGRES_PASSWORD:-Econogenius_DB_2026_Secure!}@econogenius-db:5432/${POSTGRES_DB:-econogenius}"
      SECRET_KEY: ${SECRET_KEY:-9f4c8e2a1b7d6f3e5c0a9b8d7e6f5a4c3b2d1e0f9a8b7c6d5e4f3a2b1c0d9e8f}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CORS_ORIGINS: '["https://econogenius.lazcano.cloud","http://econogenius.lazcano.cloud"]'
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-10}
      AUTO_CREATE_TABLES: "true"
    volumes:
      - econogenius_backend_data:/app/data
    networks:
      - econogenius-internal
    labels:
      - "traefik.enable=false"

  econogenius-web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: econogenius-web
    restart: unless-stopped
    depends_on:
      - econogenius-backend
    networks:
      - proxy
      - econogenius-internal
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.econogenius.rule=Host(`econogenius.lazcano.cloud`)"
      - "traefik.http.routers.econogenius.entrypoints=web"
      - "traefik.http.services.econogenius.loadbalancer.server.port=80"

volumes:
  econogenius_postgres_data:
    name: econogenius_postgres_data
  econogenius_backend_data:
    name: econogenius_backend_data

networks:
  proxy:
    external: true
  econogenius-internal:
    name: econogenius_internal
    driver: bridge
